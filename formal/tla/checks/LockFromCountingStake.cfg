\* KNOWN LIMITATION of the SPEC.md rules (expected to FAIL): the lock is paid
\* from LIVE stake, which can be a new backer's pending (non-counting) stake. Fixed by
\* S8 decision 9 (WalletHasCountingRemoval): passes in the S8Rules = TRUE main runs.
CONSTANTS
  Depositors = {d1, d2}
  Wallets = {w1, w2}
  Buyer = buyer
  NoD = NoD
  NoW = NoW
  MinStake = 2
  Lock = 1
  MaxDeposit = 2
  MaxTokens = 2
  MaxChallenges = 1000000
  CurveEnabled = FALSE
  CutoverMode = "twoTx"
  S8Rules = FALSE
  CoreChurn = FALSE
SPECIFICATION Spec
VIEW ViewMap
SYMMETRY Symm
INVARIANTS LockFromCountingStake
CHECK_DEADLOCK FALSE
