\* Review #3 (expected to FAIL, S8 rules without S8b consent): a depositor the wallet
\* did not approve takes its empty backer slot. No VIEW (the VIEW projects approvedBacker
\* out when S8bRules = FALSE); ids bounded. With S8bRules = TRUE the property holds (M1, M1b, M2).
CONSTANTS
  Depositors = {d1, d2}
  Wallets = {w1}
  Buyer = buyer
  NoD = NoD
  NoW = NoW
  MinStake = 2
  Lock = 1
  MaxDeposit = 2
  MaxTokens = 2
  MaxChallenges = 2
  CurveEnabled = FALSE
  CutoverMode = "twoTx"
  S8Rules = TRUE
  S8bRules = FALSE
  CoreChurn = FALSE
SPECIFICATION Spec
PROPERTIES OnlyApprovedBackerTakesEmptySlot
CHECK_DEADLOCK FALSE
