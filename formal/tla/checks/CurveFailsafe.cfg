\* Finding F1, FIXED in S8b (expected to PASS): with the bonus curve on and the
\* failsafe fired, removals never count again, so no stake that has left the module is counted.
\* checks/CurveFailsafePreS8b.cfg keeps the pre-S8b counterexample.
CONSTANTS
  Depositors = {d1, d2}
  Wallets = {w1, w2}
  Buyer = buyer
  NoD = NoD
  NoW = NoW
  MinStake = 2
  Lock = 1
  MaxDeposit = 2
  MaxTokens = 2
  MaxChallenges = 1000000
  CurveEnabled = TRUE
  CutoverMode = "twoTx"
  S8Rules = TRUE
  S8bRules = TRUE
  CoreChurn = FALSE
SPECIFICATION Spec
VIEW ViewMap
SYMMETRY Symm
INVARIANTS NoDoubleCount NoDoubleCountStrict StakeNeverLeavesWhileCounting
CHECK_DEADLOCK FALSE
