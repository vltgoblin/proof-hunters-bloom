\* Cross-check of the VIEW/SYMMETRY reduction: no VIEW, no SYMMETRY, ids
\* bounded by MaxChallenges; same safety properties as M1, smaller scope (CoreChurn = FALSE).
CONSTANTS
  Depositors = {d1, d2}
  Wallets = {w1}
  Buyer = buyer
  NoD = NoD
  NoW = NoW
  MinStake = 2
  Lock = 1
  MaxDeposit = 2
  MaxTokens = 2
  MaxChallenges = 3
  CurveEnabled = FALSE
  CutoverMode = "twoTx"
  S8Rules = TRUE
  CoreChurn = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK WiredTracksCore LedgerConsistent Solvency
  NoDoubleCount NoDoubleCountStrict OneBackerPerWallet StakeNeverLeavesWhileCounting
  LockIffMint OneLockPerToken ReleaseOnceAfterBurnToBeneficiary
  CutoverNoGap RewireSameEpochLowersOnly NoFreezeInOpenChallenge
  EligibleWinnerNeverBlockedInv ExitsOpenInv LockFromCountingStake
PROPERTIES FrozenVsLive PostSunsetPermanent LocksMonotone
CHECK_DEADLOCK FALSE
