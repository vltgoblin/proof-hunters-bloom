\* Liveness under weak fairness (LiveSpec). No VIEW / SYMMETRY (not sound for
\* liveness), so the scope is small: one depositor, one wallet, CoreChurn = FALSE, and
\* refreshExpiredSeed bounded by MaxChallenges so the graph is finite.
CONSTANTS
  Depositors = {d1}
  Wallets = {w1}
  Buyer = buyer
  NoD = NoD
  NoW = NoW
  MinStake = 2
  Lock = 1
  MaxDeposit = 2
  MaxTokens = 2
  MaxChallenges = 2
  CurveEnabled = FALSE
  CutoverMode = "twoTx"
  S8Rules = TRUE
  S8bRules = TRUE
  CoreChurn = FALSE
SPECIFICATION LiveSpec
PROPERTIES EligibleWinnerNeverBlocked ExitsAlwaysOpen
CHECK_DEADLOCK FALSE
