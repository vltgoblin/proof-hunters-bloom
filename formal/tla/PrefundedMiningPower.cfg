\* M1 main run, protocol scope: full core churn (old custody, stop sunset, late
\* attach, stop, mint-out, failsafe), two-transaction cutover, S8 + S8b rules (current contract).
\* Challenge ids are unbounded; the VIEW makes the state graph finite (README).
\* S8b: MaxDeposit reduced 3 -> 2 (with the S8b state MaxDeposit = 3 exceeded the 25-minute
\* bound: 2.2M distinct states at depth 20 after 7 min, queue still growing; README).
CONSTANTS
  Depositors = {d1, d2}
  Wallets = {w1}
  Buyer = buyer
  NoD = NoD
  NoW = NoW
  MinStake = 2
  Lock = 1
  MaxDeposit = 2
  MaxTokens = 2
  MaxChallenges = 1000000
  CurveEnabled = FALSE
  CutoverMode = "twoTx"
  S8Rules = TRUE
  S8bRules = TRUE
  CoreChurn = TRUE
SPECIFICATION Spec
VIEW ViewMap
SYMMETRY Symm
INVARIANTS
  TypeOK WiredTracksCore LedgerConsistent Solvency
  NoDoubleCount NoDoubleCountStrict OneBackerPerWallet StakeNeverLeavesWhileCounting
  LockIffMint OneLockPerToken ReleaseOnceAfterBurnToBeneficiary
  CutoverNoGap RewireSameEpochLowersOnly NoFreezeInOpenChallenge
  EligibleWinnerNeverBlockedInv ExitsOpenInv LockFromCountingStake
PROPERTIES FrozenVsLive PostSunsetPermanent LocksMonotone OnlyApprovedBackerTakesEmptySlot EvictedStakeNotWithdrawnBeforeCooldown
CHECK_DEADLOCK FALSE
