\* M1 main run, protocol scope: full core churn (old custody, stop sunset, late
\* attach, stop, mint-out, failsafe), two-transaction cutover, S8 rules (current contract).
\* Challenge ids are unbounded; the VIEW makes the state graph finite (README).
CONSTANTS
  Depositors = {d1, d2}
  Wallets = {w1}
  Buyer = buyer
  NoD = NoD
  NoW = NoW
  MinStake = 2
  Lock = 1
  MaxDeposit = 3
  MaxTokens = 2
  MaxChallenges = 1000000
  CurveEnabled = FALSE
  CutoverMode = "twoTx"
  S8Rules = TRUE
  CoreChurn = TRUE
SPECIFICATION Spec
VIEW ViewMap
SYMMETRY Symm
INVARIANTS
  TypeOK WiredTracksCore LedgerConsistent Solvency
  NoDoubleCount NoDoubleCountStrict OneBackerPerWallet StakeNeverLeavesWhileCounting
  LockIffMint OneLockPerToken ReleaseOnceAfterBurnToBeneficiary
  CutoverNoGap RewireSameEpochLowersOnly NoFreezeInOpenChallenge
  EligibleWinnerNeverBlockedInv ExitsOpenInv LockFromCountingStake
PROPERTIES FrozenVsLive PostSunsetPermanent LocksMonotone
CHECK_DEADLOCK FALSE
