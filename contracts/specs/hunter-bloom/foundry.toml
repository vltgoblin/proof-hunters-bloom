[profile.default]
src = "src"
test = "test"
libs = ["../../lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
remappings = [
  "@openzeppelin/contracts/=../../lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "./test/fixtures/weighted-ratio-vectors.json" },
  { access = "read", path = "./test/fixtures/weighted-reward-vectors.json" },
]

[profile.default.fuzz]
runs = 128
