[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
gas_limit = 1_000_000_000
optimizer = false
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = []
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Retains the original optimized candidate profile. Not deployment approval.
[profile.release]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
